<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Vignesh Growth Lab POS</title>
  <meta name="description" content="Secure POS Terminal Login — Vignesh Growth Lab">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vgl_theme.css') }}?v=3.0.0">
  <script>
    // Initialize Theme immediately
    const currentTheme = localStorage.getItem('vgl_theme') || 'dark';
    if (currentTheme === 'light') {
      document.documentElement.classList.add('theme-light');
    }
  </script>
  <style>
    /* ── Fullscreen Auth Experience ───────────────────────────── */
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* Subtle ambient light glows */
    .login-bg-glow-1 {
      position: absolute;
      top: -120px;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .login-bg-glow-2 {
      position: absolute;
      bottom: -150px;
      right: 20%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
      backdrop-filter: blur(24px);
      position: relative;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .login-brand-avatar {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* Role Quick-Switch Pills */
    .role-pills {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 22px;
    }

    .role-pill {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .role-pill:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .role-pill.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    /* Form Fields */
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 42px 12px 42px;
      color: #ffffff;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .login-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      background: rgba(30, 41, 59, 0.9);
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    /* Sign In Button */
    .btn-sign-in {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-sign-in:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
      background: linear-gradient(135deg, #fbbf24, #d97706);
    }

    .btn-sign-in:active {
      transform: translateY(0);
    }

    .quick-demo-box {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.06);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .btn-quick-login {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-quick-login:hover {
      background: #f59e0b;
      color: #ffffff;
    }

    /* Top Utility Bar (Theme toggle) */
    .top-utility {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-btn-round {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .theme-btn-round:hover {
      background: rgba(255,255,255,0.1);
      transform: scale(1.05);
    }

    /* Light Theme Styling */
    html.theme-light body.login-body {
      background: #f1f5f9;
    }
    html.theme-light .login-card {
      background: #ffffff;
      border-color: #e2e8f0;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.03);
    }
    html.theme-light .login-title {
      color: #0f172a;
    }
    html.theme-light .role-pills {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    html.theme-light .login-input {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    html.theme-light .login-input:focus {
      background: #ffffff;
      border-color: #f59e0b;
    }
    html.theme-light .quick-demo-box {
      background: #fffbeb;
      border-color: #fde68a;
    }
  </style>
</head>
<body class="login-body">

  <!-- Ambient Light Effects -->
  <div class="login-bg-glow-1"></div>
  <div class="login-bg-glow-2"></div>

  <!-- Top Utility Controls -->
  <div class="top-utility">
    <button class="theme-btn-round" onclick="toggleTheme()" title="Toggle Theme" id="themeToggleBtn">
      🌙
    </button>
  </div>

  <!-- Main Login Card -->
  <div class="login-card text-center">
    
    <!-- Brand Logo -->
    <div class="login-brand-avatar" id="loginLogo">🍽️</div>
    
    <!-- Title & Slogan -->
    <h1 class="login-title" id="loginStoreName">Vignesh Growth Lab POS</h1>
    <div class="login-sub" id="loginTagline">Restaurant & Retail Terminal Login</div>

    <!-- Role Quick-Switch Pills -->
    <div class="role-pills">
      <button type="button" class="role-pill active" onclick="selectRole('admin', this)">
        <span>👑</span>
        <span>Store Admin</span>
      </button>
      <button type="button" class="role-pill" onclick="selectRole('cashier', this)">
        <span>👨‍🍳</span>
        <span>Cashier</span>
      </button>
      <button type="button" class="role-pill" onclick="selectRole('inventory', this)">
        <span>📦</span>
        <span>Inventory</span>
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      
      <!-- Username Field -->
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="login-input" id="usernameInput" placeholder="Username / Operator ID" value="admin" required autocomplete="username">
      </div>

      <!-- Password Field -->
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" class="login-input" id="passwordInput" placeholder="Terminal Passcode" value="admin123" required autocomplete="current-password">
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Passcode">
          <span id="pwdEyeIcon">👁️</span>
        </button>
      </div>

      <!-- Remember & Forgot Options -->
      <div class="d-flex justify-content-between align-items-center mb-3 text-xs">
        <label class="d-flex align-items-center gap-2 cursor-pointer text-muted m-0">
          <input type="checkbox" id="rememberTerminal" class="form-check-input m-0" checked>
          <span>Remember Terminal</span>
        </label>
        <a href="javascript:void(0)" onclick="forgotPasscodeAlert()" class="text-warning text-decoration-none fw-semibold">
          Reset PIN?
        </a>
      </div>

      <!-- Error Alert Box -->
      <div id="loginErrorAlert" class="alert alert-danger py-2 px-3 text-xs text-start mb-3 d-none" role="alert">
        ⚠️ Invalid credentials. Please check your username and passcode.
      </div>

      <!-- Sign In CTA -->
      <button type="submit" class="btn-sign-in" id="signInBtn">
        <span>Sign In to Terminal</span>
        <span>→</span>
      </button>

      <!-- 1-Click Fast Demo Login -->
      <div class="quick-demo-box">
        <span class="text-muted">🚀 Quick Demo Access:</span>
        <button type="button" class="btn-quick-login" onclick="oneClickDemoLogin()">
          1-Click Sign In
        </button>
      </div>

    </form>

    <!-- Card Footer -->
    <div class="text-muted text-xs mt-4 pt-3 border-top border-secondary border-opacity-10">
      GSTIN: 33AABCU9603R1ZX · Tamil Nadu<br>
      <span style="opacity: 0.7;">Standalone POS Engine v2.4.0 · Encrypted Session</span>
    </div>

  </div>

  <script>
    // Load store branding if customized in Settings
    try {
      const raw = localStorage.getItem('vgl_store_settings');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.storeName) document.getElementById('loginStoreName').textContent = s.storeName;
        if (s.storeIcon) document.getElementById('loginLogo').textContent = s.storeIcon;
        if (s.tagline) document.getElementById('loginTagline').textContent = s.tagline;
      }
    } catch(e) {}

    // Preset Role Credentials
    const ROLES = {
      admin: { user: 'admin', pass: 'admin123', label: 'Store Admin' },
      cashier: { user: 'cashier', pass: 'pos123', label: 'Cashier / Counter' },
      inventory: { user: 'inventory', pass: 'stock123', label: 'Inventory Staff' }
    };

    function selectRole(roleKey, btn) {
      document.querySelectorAll('.role-pill').forEach(el => el.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const role = ROLES[roleKey];
      if (role) {
        document.getElementById('usernameInput').value = role.user;
        document.getElementById('passwordInput').value = role.pass;
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const eye = document.getElementById('pwdEyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        eye.textContent = '🙈';
      } else {
        input.type = 'password';
        eye.textContent = '👁️';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const errBox = document.getElementById('loginErrorAlert');
      const btn = document.getElementById('signInBtn');

      errBox.classList.add('d-none');

      // Validate against configured roles or allow standard credentials
      const isValid = (user === 'admin' && pass === 'admin123') ||
                      (user === 'cashier' && pass === 'pos123') ||
                      (user === 'inventory' && pass === 'stock123') ||
                      (user && pass && pass.length >= 3); // Flexible client demo fallback

      if (!isValid) {
        errBox.classList.remove('d-none');
        return;
      }

      // Show animated loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Authenticating...';

      // Save session info in localStorage
      const session = {
        username: user,
        role: user === 'admin' ? 'Store Admin' : (user === 'cashier' ? 'Cashier' : 'Inventory'),
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('vgl_session', JSON.stringify(session));

      setTimeout(() => {
        // Redirect to POS terminal or Dashboard
        window.location.href = '/pos';
      }, 600);
    }

    function oneClickDemoLogin() {
      selectRole('admin', document.querySelector('.role-pill'));
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    function forgotPasscodeAlert() {
      alert("Terminal Security Notice:\n\nDefault Passcodes for this terminal:\n• Admin: admin / admin123\n• Cashier: cashier / pos123\n• Inventory: inventory / stock123");
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('theme-light');
      localStorage.setItem('vgl_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggleBtn').textContent = isLight ? '☀️' : '🌙';
    }

    // Sync theme button icon on load
    if (document.documentElement.classList.contains('theme-light')) {
      document.getElementById('themeToggleBtn').textContent = '☀️';
    }
  </script>
</body>
</html>
