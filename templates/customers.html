{% extends 'base.html' %}
{% block title %}Customers{% endblock %}
{% block page_title %}Customers Directory{% endblock %}

{% block content %}
<div class="page-toolbar">
  <div class="toolbar-left">
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="customerSearch" placeholder="Search name / phone..." class="search-input">
    </div>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-primary" id="addCustomerBtn">+ Add Customer</button>
  </div>
</div>

<div class="customers-grid" id="customersGrid">
  <div class="loading-state"><div class="spinner"></div><p>Loading...</p></div>
</div>

{% endblock %}

{% block modals %}
<!-- Customer Modal -->
<div class="modal" id="customerModal">
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h3 id="customerModalTitle">Add Customer</h3>
      <button class="modal-close" onclick="closeModal('customerModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="customerId">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="customerName" class="form-input" placeholder="e.g. Murugan Rajan">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="customerEmail" class="form-input" placeholder="example@gmail.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" id="customerPhone" class="form-input" placeholder="98400 00000">
      </div>
      <div class="form-group">
        <label class="form-label">GSTIN (B2B Customer)</label>
        <input type="text" id="customerGstin" class="form-input" placeholder="e.g. 33AABCA1234B1ZX">
        <div class="text-muted text-sm" style="margin-top:4px">Only if business customer</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('customerModal')">Cancel</button>
      <button class="btn btn-primary" id="saveCustomerBtn">Save</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCustomers() {
  const searchInput = document.getElementById('customerSearch');
  const q = searchInput ? searchInput.value : '';
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  const res = await fetch('/api/customers?' + params);
  const customers = await res.json();
  renderCustomers(customers);
}

function renderCustomers(customers) {
  const grid = document.getElementById('customersGrid');
  if (!customers.length) { grid.innerHTML = `<div class="loading-state"><p class="text-muted">No customers found</p></div>`; return; }
  grid.innerHTML = customers.map(c => `
    <div class="customer-card">
      <div class="customer-avatar">${escapeHtml(c.name.charAt(0).toUpperCase())}</div>
      <div class="customer-info">
        <div class="customer-name">${escapeHtml(c.name)} ${c.gstin ? '<span class="badge badge--cyan" style="font-size:10px">B2B</span>' : ''}</div>
        <div class="customer-email">${escapeHtml(c.email || '—')}</div>
        <div class="customer-phone">📞 ${escapeHtml(c.phone || '—')}</div>
        ${c.gstin ? `<div class="text-muted text-sm">GSTIN: ${escapeHtml(c.gstin)}</div>` : ''}
      </div>
      <div class="customer-stats">
        <div class="customer-stat">
          <div class="customer-stat-value">${fmt(c.total_spent)}</div>
          <div class="customer-stat-label">Total Spent</div>
        </div>
        <div class="customer-stat">
          <div class="customer-stat-value">${c.total_orders}</div>
          <div class="customer-stat-label">Orders</div>
        </div>
        <div class="customer-stat">
          <div class="customer-stat-value">⭐ ${c.points}</div>
          <div class="customer-stat-label">Points</div>
        </div>
      </div>
      <div class="customer-actions">
        <button class="btn btn-ghost btn-sm" onclick="editCustomer(${c.id})">✏️ Edit</button>
        <button class="btn btn-ghost btn-sm text-danger" onclick="deleteCustomer(${c.id}, '${escapeHtml(escJsString(c.name))}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('addCustomerBtn').addEventListener('click', () => {
  document.getElementById('customerModalTitle').textContent = 'Add New Customer';
  document.getElementById('customerId').value = '';
  ['customerName','customerEmail','customerPhone','customerGstin'].forEach(id => document.getElementById(id).value = '');
  openModal('customerModal');
});

async function editCustomer(id) {
  const res = await fetch(`/api/customers/${id}`);
  const c = await res.json();
  document.getElementById('customerModalTitle').textContent = 'Edit Customer';
  document.getElementById('customerId').value = c.id;
  document.getElementById('customerName').value = c.name;
  document.getElementById('customerEmail').value = c.email || '';
  document.getElementById('customerPhone').value = c.phone || '';
  document.getElementById('customerGstin').value = c.gstin || '';
  openModal('customerModal');
}

document.getElementById('saveCustomerBtn').addEventListener('click', async () => {
  const id = document.getElementById('customerId').value;
  const payload = {
    name: document.getElementById('customerName').value,
    email: document.getElementById('customerEmail').value,
    phone: document.getElementById('customerPhone').value,
    gstin: document.getElementById('customerGstin').value,
  };
  if (!payload.name) { showToast('Name is required', 'error'); return; }
  const url = id ? `/api/customers/${id}` : '/api/customers';
  const method = id ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (res.ok) { showToast(id ? 'Updated successfully!' : 'Added successfully!', 'success'); closeModal('customerModal'); loadCustomers(); }
  else showToast('An error occurred', 'error');
});

async function deleteCustomer(id, name) {
  if (!confirm(`Are you sure you want to delete customer "${name}"?`)) return;
  const res = await fetch(`/api/customers/${id}`, { method: 'DELETE' });
  if (res.ok) { showToast('Deleted successfully', 'success'); loadCustomers(); }
  else showToast('Cannot delete customer with sales history', 'error');
}

let st;
document.getElementById('customerSearch').addEventListener('input', () => { clearTimeout(st); st = setTimeout(loadCustomers, 300); });

loadCustomers();
</script>
{% endblock %}
